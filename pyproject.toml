[project]
name = "clipstudio"
version = "0.1.0"
description = "Cut YouTube videos into 9:16 clips with word-synced Hindi and English captions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "yt-dlp[default]==2026.10.26",
]

[project.scripts]
clipstudio = "clipstudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
